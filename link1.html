<html>
<head>
    <title>Quests </title>
    <link rel="manifest" href="manifest.json">
	<link rel="stylesheet" href="design.css">
	<meta name= "Author" content="A Walsh">
	<meta name= "description" content= "Quests App Digital Technology 2026">
	<meta name= "Keywords" content= "Quests">
	<meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
</head>

<body style="background-color: #ede6cc;">

 <h1>Quest Tracker</h1>

  <button id="newQuestBtn">🎲 Get a Random Quest</button>
  <button id="resetBtn">Reset</button>

  <ul id="questList"></ul>

  <script>
    // Pool of possible quests
    const questPool = [
      "Walk along the beach",
      "Find the longest stick",
      "Go on a walk and say the alphabet with each greeting to a stranger",
      "Walk to a beat that either speeds up/slows down and walk to that beat",
      "Multiplayer: Have a photo recreation challenge",
      "Dress up and go on a walk in some botanical gardens (or don’t idc)",
      "5 4 3 2 1 colour challenge - 5 green objects, 4 blue, 3 yellow, 2 red, and 1 pink."
    ];

    // Get the list element
    const list = document.getElementById('questList');

    // Add a random quest to the list
    function addRandomQuest() {
      const randomIndex = Math.floor(Math.random() * questPool.length);
      const quest = questPool[randomIndex];

      // Create list item
      const li = document.createElement('li');

      // Create checkbox
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';

      // Create label text
      const label = document.createElement('span');
      label.textContent = quest;

      // Toggle 'done' styling when checked
      checkbox.addEventListener('change', () => {
        if (checkbox.checked) {
          li.classList.add('done');
        } else {
          li.classList.remove('done');
        }
      });

      // Put it all together
      li.appendChild(checkbox);
      li.appendChild(label);
      list.appendChild(li);
    }

    // Reset the list
    function resetList() {
      list.innerHTML = '';
    }

    // Wire up the buttons
    document.getElementById('newQuestBtn').addEventListener('click', addRandomQuest);
    document.getElementById('resetBtn').addEventListener('click', resetList);
  </script>
    <script src="app.js" defer></script>
</body>
</html>
